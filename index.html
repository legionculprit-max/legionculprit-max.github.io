<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pouya | Creative Developer</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    background: #09090d;
    color: #f5f5f5;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    line-height: 1.9;
}

.container {
    width: 85%;
    max-width: 1150px;
    margin: auto;
}

header {
    height: 85px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #20202a;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    color: #a78bfa;
    direction: ltr;
}

.links {
    display: flex;
    gap: 30px;
}

.links a {
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
    transition: .3s;
}

.links a:hover {
    color: #a78bfa;
}

.hero {
    min-height: 650px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    padding: 80px 0;
}

.hero-text {
    flex: 1;
}

.tag {
    color: #a78bfa;
    font-size: 14px;
    letter-spacing: 2px;
}

.hero h1 {
    font-size: clamp(35px, 5vw, 58px);
    line-height: 1.5;
    margin: 20px 0;
}

.hero h1 span {
    color: #a78bfa;
}

.hero p {
    color: #999;
    max-width: 560px;
    font-size: 16px;
}

.photo {
    width: 340px;
    height: 430px;
    object-fit: cover;
    border-radius: 22px;
    border: 1px solid #5b4294;
    box-shadow: 0 15px 70px #7c3aed22;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 11px 27px;
    background: #8b5cf6;
    color: white;
    text-decoration: none;
    border-radius: 9px;
    transition: .3s;
}

.button:hover {
    background: #7040d0;
    transform: translateY(-3px);
}

section {
    padding: 90px 0;
    border-top: 1px solid #20202a;
}

.section-title {
    font-size: 30px;
    margin-bottom: 35px;
}

.section-title span {
    color: #a78bfa;
}

.about-text {
    color: #aaa;
    font-size: 15px;
    max-width: 900px;
    line-height: 2.5;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card {
    background: #12121b;
    border: 1px solid #252535;
    padding: 27px;
    border-radius: 15px;
    transition: .3s;
}

.card:hover {
    border-color: #8b5cf6;
    transform: translateY(-5px);
}

.card h3 {
    color: #c4b5fd;
    margin-bottom: 12px;
    font-size: 18px;
}

.card p {
    color: #999;
    font-size: 14px;
}

.tools {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.tool {
    direction: ltr;
    background: #171421;
    border: 1px solid #373047;
    color: #c4b5fd;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
}

footer {
    text-align: center;
    padding: 35px;
    color: #777;
    font-size: 13px;
    border-top: 1px solid #20202a;
}

@media(max-width: 750px) {
    .container {
        width: 90%;
    }

    .links {
        gap: 12px;
    }

    .links a {
        font-size: 12px;
    }

    .hero {
        flex-direction: column-reverse;
        text-align: center;
        padding: 60px 0;
    }

    .photo {
        width: 260px;
        height: 320px;
    }

    .hero p {
        margin: auto;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .section-title {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
<nav class="container">
    <div class="logo">POUYA.</div>
    <div class="links">
        <a href="#about">درباره من</a>
        <a href="#skills">مهارت‌ها</a>
        <a href="#interests">علاقه‌مندی‌ها</a>
    </div>
</nav>
</header>

<main>

<div class="container">
<div class="hero">

    <div class="hero-text">
        <div class="tag">WELCOME TO MY PORTFOLIO</div>

        <h1>
            سلام، من <span>پویا</span> هستم
        </h1>

        <p>
            دانشجوی مهندسی کامپیوتر، علاقه‌مند به دنی
